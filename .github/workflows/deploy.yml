name: Deploy Fullstack App (Production & Staging)

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ------------------ FRONTEND ------------------
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build React app
        run: |
          cd frontend
          npm run build

      - name: Deploy frontend
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avzr --delete
          path: frontend/build/
          remote_path: ${{ github.ref == 'refs/heads/main' && '/home/' + secrets.CPANEL_USER + '/public_html/' || '/home/' + secrets.CPANEL_USER + '/staging_frontend/' }}
          remote_host: ${{ secrets.CPANEL_HOST }}
          remote_user: ${{ secrets.CPANEL_USER }}
          remote_key: ${{ secrets.CPANEL_KEY }}
          remote_port: ${{ secrets.CPANEL_PORT }}

      # ------------------ BACKEND ------------------
      - name: Deploy backend files
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avzr --delete --exclude=node_modules
          path: backend/
          remote_path: ${{ github.ref == 'refs/heads/main' && '/home/' + secrets.CPANEL_USER + '/myapp/' || '/home/' + secrets.CPANEL_USER + '/myapp_staging/' }}
          remote_host: ${{ secrets.CPANEL_HOST }}
          remote_user: ${{ secrets.CPANEL_USER }}
          remote_key: ${{ secrets.CPANEL_KEY }}
          remote_port: ${{ secrets.CPANEL_PORT }}

      - name: Install backend dependencies & restart app
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              cd /home/${{ secrets.CPANEL_USER }}/myapp
            else
              cd /home/${{ secrets.CPANEL_USER }}/myapp_staging
            fi
            npm install --production
            mkdir -p tmp
            touch tmp/restart.txt
