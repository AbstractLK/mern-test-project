name: Deploy Fullstack App (Production & Staging)

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      CPANEL_HOME: /home/${{ secrets.CPANEL_USER }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ------------------ FRONTEND ------------------
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build React app
        run: |
          cd frontend
          npm run build

      - name: Deploy frontend (Production)
        if: env.DEPLOY_ENV == 'production'
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avzr --delete
          path: frontend/build/
          remote_path: ${{ env.CPANEL_HOME }}/public_html/
          remote_host: ${{ secrets.CPANEL_HOST }}
          remote_user: ${{ secrets.CPANEL_USER }}
          remote_key: ${{ secrets.CPANEL_KEY }}
          remote_port: ${{ secrets.CPANEL_PORT }}

      - name: Deploy frontend (Staging)
        if: env.DEPLOY_ENV == 'staging'
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avzr --delete
          path: frontend/build/
          remote_path: ${{ env.CPANEL_HOME }}/staging_frontend/
          remote_host: ${{ secrets.CPANEL_HOST }}
          remote_user: ${{ secrets.CPANEL_USER }}
          remote_key: ${{ secrets.CPANEL_KEY }}
          remote_port: ${{ secrets.CPANEL_PORT }}

      # ------------------ BACKEND ------------------
      - name: Deploy backend (Production)
        if: env.DEPLOY_ENV == 'production'
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avzr --delete --exclude=node_modules
          path: backend/
          remote_path: ${{ env.CPANEL_HOME }}/myapp/
          remote_host: ${{ secrets.CPANEL_HOST }}
          remote_user: ${{ secrets.CPANEL_USER }}
          remote_key: ${{ secrets.CPANEL_KEY }}
          remote_port: ${{ secrets.CPANEL_PORT }}

      - name: Deploy backend (Staging)
        if: env.DEPLOY_ENV == 'staging'
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avzr --delete --exclude=node_modules
          path: backend/
          remote_path: ${{ env.CPANEL_HOME }}/myapp_staging/
          remote_host: ${{ secrets.CPANEL_HOST }}
          remote_user: ${{ secrets.CPANEL_USER }}
          remote_key: ${{ secrets.CPANEL_KEY }}
          remote_port: ${{ secrets.CPANEL_PORT }}

      - name: Install backend dependencies & restart app
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            if [ "${DEPLOY_ENV}" = "production" ]; then
              cd $CPANEL_HOME/myapp
            else
              cd $CPANEL_HOME/myapp_staging
            fi
            npm install --production
            mkdir -p tmp
            touch tmp/restart.txt
