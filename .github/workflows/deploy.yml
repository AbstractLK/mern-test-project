name: Deploy Fullstack App (Production & Staging)

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      CPANEL_HOME: /home/${{ secrets.CPANEL_USER }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ------------------ FRONTEND ------------------
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build React app
        run: |
          cd frontend
          npm run build

      - name: Deploy frontend (Production)
        if: env.DEPLOY_ENV == 'production'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "frontend/build/*"
          target: "${{ env.CPANEL_HOME }}/public_html/"

      - name: Deploy frontend (Staging)
        if: env.DEPLOY_ENV == 'staging'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "frontend/build/*"
          target: "${{ env.CPANEL_HOME }}/staging_frontend/"

      # ------------------ BACKEND ------------------
      - name: Deploy backend (Production)
        if: env.DEPLOY_ENV == 'production'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "backend/*"
          target: "${{ env.CPANEL_HOME }}/myapp/"

      - name: Deploy backend (Staging)
        if: env.DEPLOY_ENV == 'staging'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "backend/*"
          target: "${{ env.CPANEL_HOME }}/myapp_staging/"

      - name: Install backend dependencies & restart app
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            if [ "${DEPLOY_ENV}" = "production" ]; then
              cd $CPANEL_HOME/myapp
            else
              cd $CPANEL_HOME/myapp_staging
            fi
            npm install --production
            mkdir -p tmp
            touch tmp/restart.txt
